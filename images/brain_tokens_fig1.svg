<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="640" rx="14" fill="#ffffff"/>
  <text x="600" y="44" text-anchor="middle" font-size="25" font-weight="700" fill="#1e293b">Brain-as-language: learning causal structure from slowly sampled recordings</text>
  <text x="600" y="72" text-anchor="middle" font-size="16" fill="#64748b">The simulated pipeline used for training and evaluation. Results so far are on synthetic data; the paper is in preparation.</text>
  <rect x="41" y="104" width="206" height="206" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="144.0" y="142" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Fast causal graph</text>
  <text x="144.0" y="178" text-anchor="middle" font-size="15.5" fill="#475569">random directed graph</text>
  <text x="144.0" y="202" text-anchor="middle" font-size="15.5" fill="#475569">at the true timescale,</text>
  <text x="144.0" y="226" text-anchor="middle" font-size="15.5" fill="#475569">relabelled for every</text>
  <text x="144.0" y="250" text-anchor="middle" font-size="15.5" fill="#475569">instance</text>
  <line x1="250" y1="207.0" x2="266" y2="207.0" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="269" y="104" width="206" height="206" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="372.0" y="142" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Simulator</text>
  <text x="372.0" y="178" text-anchor="middle" font-size="15.5" fill="#475569">stable VAR dynamics</text>
  <text x="372.0" y="202" text-anchor="middle" font-size="15.5" fill="#475569">→ hemodynamic</text>
  <text x="372.0" y="226" text-anchor="middle" font-size="15.5" fill="#475569">response (fMRI-like)</text>
  <text x="372.0" y="250" text-anchor="middle" font-size="15.5" fill="#475569">→ keep every u-th</text>
  <text x="372.0" y="274" text-anchor="middle" font-size="15.5" fill="#475569">sample</text>
  <line x1="478" y1="207.0" x2="494" y2="207.0" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="497" y="104" width="206" height="206" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="600.0" y="142" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Brain vocabulary</text>
  <text x="600.0" y="178" text-anchor="middle" font-size="15.5" fill="#475569">one symbol per region</text>
  <text x="600.0" y="202" text-anchor="middle" font-size="15.5" fill="#475569">per sample; slower</text>
  <text x="600.0" y="226" text-anchor="middle" font-size="15.5" fill="#475569">sampling = deleting</text>
  <text x="600.0" y="250" text-anchor="middle" font-size="15.5" fill="#475569">token sentences</text>
  <text x="600.0" y="274" text-anchor="middle" font-size="15.5" fill="#475569">(proved)</text>
  <line x1="706" y1="207.0" x2="722" y2="207.0" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="725" y="104" width="206" height="206" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="828.0" y="142" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Axial transformer</text>
  <text x="828.0" y="178" text-anchor="middle" font-size="15.5" fill="#475569">attention over time</text>
  <text x="828.0" y="202" text-anchor="middle" font-size="15.5" fill="#475569">and over regions,</text>
  <text x="828.0" y="226" text-anchor="middle" font-size="15.5" fill="#475569">lag-aware pair readout;</text>
  <text x="828.0" y="250" text-anchor="middle" font-size="15.5" fill="#475569">~1M simulated</text>
  <text x="828.0" y="274" text-anchor="middle" font-size="15.5" fill="#475569">recordings</text>
  <line x1="934" y1="207.0" x2="950" y2="207.0" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="953" y="104" width="206" height="206" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1056.0" y="142" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Directed links</text>
  <text x="1056.0" y="178" text-anchor="middle" font-size="15.5" fill="#475569">a score for every</text>
  <text x="1056.0" y="202" text-anchor="middle" font-size="15.5" fill="#475569">ordered pair of</text>
  <text x="1056.0" y="226" text-anchor="middle" font-size="15.5" fill="#475569">regions: AUROC</text>
  <text x="1056.0" y="250" text-anchor="middle" font-size="15.5" fill="#475569">0.71–0.77 across</text>
  <text x="1056.0" y="274" text-anchor="middle" font-size="15.5" fill="#475569">sampling rates</text>
  <rect x="41" y="348" width="548" height="210" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="41" y="348" width="6" height="210" rx="3" fill="#3b82f6"/>
  <text x="69" y="388" font-size="18" font-weight="700" fill="#1e293b">Controls before claims</text>
  <text x="69" y="424" font-size="16" fill="#475569">Every learned result must beat a data-free prior and</text>
  <text x="69" y="450" font-size="16" fill="#475569">time-shuffled and time-shifted copies of the same data.</text>
  <text x="69" y="476" font-size="16" fill="#475569">Those controls stay at chance (AUROC ≈ 0.50). The same</text>
  <text x="69" y="502" font-size="16" fill="#475569">checks caught a data-leakage bug in a synthetic</text>
  <text x="69" y="528" font-size="16" fill="#475569">benchmark before any result was reported.</text>
  <rect x="612" y="348" width="548" height="210" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="612" y="348" width="6" height="210" rx="3" fill="#3b82f6"/>
  <text x="640" y="388" font-size="18" font-weight="700" fill="#1e293b">Where the information lives</text>
  <text x="640" y="424" font-size="16" fill="#475569">A likelihood ranker over second-order statistics picks</text>
  <text x="640" y="450" font-size="16" fill="#475569">the true graph among candidates the solver cannot tell</text>
  <text x="640" y="476" font-size="16" fill="#475569">apart: first in 86% of cases with 140 samples and 100%</text>
  <text x="640" y="502" font-size="16" fill="#475569">with 500, versus 61% for a simplicity prior (simulated</text>
  <text x="640" y="528" font-size="16" fill="#475569">linear data sampled at half rate).</text>
  <text x="600" y="608" text-anchor="middle" font-size="14.5" fill="#64748b">PyTorch research package · about 60 SLURM jobs on A100 and H100 GPUs · code: github.com/sajadabvi/fmri_tokens_causal</text>
</svg>
